name: "✨ Feature Request"
description: Propose a new feature, architecture improvement, or integration
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or enterprise capability for Jupsoft Shortly.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Need
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - API & Data Model
        - Console Dashboard UI
        - Analytics & Attribution Engine
        - Vector QR Code Studio
        - DLT / Telecom Integration
        - Multi-Tenant RBAC
    validations:
      required: true
