name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Lint, Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend Regression & Security Unit Tests
        run: |
          pnpm --filter backend-nestjs test src/regression.spec.ts src/security-audit.spec.ts src/app.controller.spec.ts

      - name: Build Backend (NestJS)
        run: pnpm --filter backend-nestjs build

      - name: Build Frontend (Next.js Standalone)
        run: pnpm --filter frontend build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN: "go.jupsoft.com"
          NEXT_PUBLIC_CNAME_DOMAIN: "go.jupsoft.com"

  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: audit-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose Build
        run: |
          docker compose build --progress=plain
        env:
          DB_USER: test_user
          DB_PASSWORD: test_password_16char_min
          DB_NAME: test_db
          BASE_URL: https://test.jupsoft.com
          JWT_SECRET: test_secret_key_at_least_32_characters_long
          FRONTEND_URL: https://test.jupsoft.com
          CORS_ORIGINS: https://test.jupsoft.com
          DEFAULT_DOMAIN_ID: 0bb05033-f0ae-4779-b747-d386b8d67be1
          DEFAULT_DOMAIN_HOST: test.jupsoft.com
          BACKEND_URL: http://backend:3000
          NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN: test.jupsoft.com
          NEXT_PUBLIC_CNAME_DOMAIN: test.jupsoft.com
