# Upstream definitions
upstream backend_upstream {
    server backend:3000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:5000;
    keepalive 32;
}

# 1. HTTP Server - Port 80 (ACME Challenge + HTTP to HTTPS Redirection)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health check for reverse proxy
    location = /nginx-health {
        access_log off;
        return 200 'healthy\n';
    }

    # Redirect all HTTP traffic to HTTPS (uncomment below once SSL certificates are mounted)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Fallback when running without TLS or before SSL certificates are generated
    include /etc/nginx/conf.d/proxy_routes.inc;
}

# 2. HTTPS Server - Port 443 (Production TLS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Paths (Mount valid certificates in ./nginx/certs or via certbot)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    include /etc/nginx/conf.d/proxy_routes.inc;
}
