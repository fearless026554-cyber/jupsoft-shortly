# ==============================================================================
# Host Nginx Configuration for go.jupsoft.com
# Routes traffic to Dockerized Frontend (127.0.0.1:5001) & Backend (127.0.0.1:3001)
# ==============================================================================

upstream shortly_frontend {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream shortly_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name go.jupsoft.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - SSL Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.jupsoft.com;

    ssl_certificate /etc/letsencrypt/live/go.jupsoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.jupsoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Next.js Static Chunks & Assets
    location /_next/static/ {
        proxy_pass http://shortly_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Core Assets
    location /_next/ {
        proxy_pass http://shortly_frontend;
    }

    # Next.js UI Pages & Favicons
    location = / {
        proxy_pass http://shortly_frontend;
    }

    location = /login {
        proxy_pass http://shortly_frontend;
    }

    location = /landing {
        proxy_pass http://shortly_frontend;
    }

    location = /icon.png {
        proxy_pass http://shortly_frontend;
    }

    location = /favicon.ico {
        proxy_pass http://shortly_frontend;
    }

    # Next.js Client Proxy & Config
    location /api/proxy/ {
        proxy_pass http://shortly_frontend;
    }

    location /api/config {
        proxy_pass http://shortly_frontend;
    }

    # Backend REST APIs
    location /api/ {
        proxy_pass http://shortly_backend;
    }

    # Backend Health Check
    location = /health {
        proxy_pass http://shortly_backend/health;
    }

    # System Routes
    location /system/ {
        proxy_pass http://shortly_backend;
    }

    # Short Link Redirections (Catch-all)
    location / {
        proxy_pass http://shortly_backend;
    }
}
