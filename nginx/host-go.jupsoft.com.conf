# ==============================================================================
# Host Nginx Configuration for go.jupsoft.com
# Routes traffic to Frontend (127.0.0.1:5001) & Backend (127.0.0.1:3001)
# ==============================================================================

upstream shortly_frontend {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream shortly_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name go.jupsoft.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - SSL Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.jupsoft.com;

    ssl_certificate /etc/letsencrypt/live/go.jupsoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.jupsoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # 1. Next.js Static Chunks & Core Assets
    location /_next/ {
        proxy_pass http://shortly_frontend;
    }

    # 2. Next.js Public Assets (Images, Logos, Favicons, SVGs, Fonts)
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|css|js|woff|woff2|ttf|eot|webmanifest|json)$ {
        proxy_pass http://shortly_frontend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Next.js Frontend SPA Pages & Tabs
    # Matches: /dashboard, /tenants, /links, /bulk, /outcomes, /qr, /reports, /analytics, /users, /domains, /abuse, /apikeys, /profile, /help, /login, /landing
    location ~ ^/(dashboard|overview|links|bulk|outcomes|qr|reports|analytics|tenants|users|domains|abuse|apikeys|profile|help|login|landing)/?$ {
        proxy_pass http://shortly_frontend;
    }

    # Root Route
    location = / {
        proxy_pass http://shortly_frontend;
    }

    # 4. Next.js Client Proxy & API Config
    location /api/proxy {
        proxy_pass http://shortly_frontend;
    }

    location /api/config {
        proxy_pass http://shortly_frontend;
    }

    # 5. Backend Direct REST APIs
    location /api/ {
        proxy_pass http://shortly_backend;
    }

    # 6. Backend Health Check
    location = /health {
        proxy_pass http://shortly_backend/health;
    }

    # 7. System Routes
    location /system/ {
        proxy_pass http://shortly_backend;
    }

    # 8. Short Link Redirections (Catch-all for short link slugs like /rlstest)
    location / {
        proxy_pass http://shortly_backend;
    }
}
