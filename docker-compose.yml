version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jupsoft_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-jlmp_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-nestjs/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jlmp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jupsoft_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    container_name: jupsoft_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3000
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${DB_USER:-postgres}
      - PG_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - PG_DATABASE=${DB_NAME:-jlmp_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5001}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5001}
      - DEFAULT_DOMAIN_ID=${DEFAULT_DOMAIN_ID:-00000000-0000-0000-0000-000000000001}
      - DEFAULT_DOMAIN_HOST=${DEFAULT_DOMAIN_HOST:-jup.link}
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jupsoft_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
      - CMS_API_KEY=${CMS_API_KEY:-}
      - NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN=${NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN:-jup.link}
      - NEXT_PUBLIC_CNAME_DOMAIN=${NEXT_PUBLIC_CNAME_DOMAIN:-cname.jup.link}
    ports:
      - "5001:5000"

volumes:
  postgres_data:
  redis_data:
