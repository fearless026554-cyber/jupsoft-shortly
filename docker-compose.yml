version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: jupsoft_redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else redis-server --appendonly yes; fi"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend-nestjs/Dockerfile
    container_name: jupsoft_backend
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BASE_URL=${BASE_URL:?BASE_URL is required}
      - PG_HOST=${PG_HOST:?PG_HOST is required}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER:?PG_USER is required}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - PG_DATABASE=${PG_DATABASE:-postgres}
      - PG_SSL=${PG_SSL:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRY=${JWT_EXPIRY:-1d}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
      - DEFAULT_DOMAIN_ID=${DEFAULT_DOMAIN_ID:?DEFAULT_DOMAIN_ID is required}
      - DEFAULT_DOMAIN_HOST=${DEFAULT_DOMAIN_HOST:?DEFAULT_DOMAIN_HOST is required}
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN: ${NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN:-}
        NEXT_PUBLIC_CNAME_DOMAIN: ${NEXT_PUBLIC_CNAME_DOMAIN:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: jupsoft_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
      - CMS_API_KEY=${CMS_API_KEY:-}
      - NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN=${NEXT_PUBLIC_DEFAULT_SHORT_DOMAIN:-}
      - NEXT_PUBLIC_CNAME_DOMAIN=${NEXT_PUBLIC_CNAME_DOMAIN:-}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: jupsoft_nginx
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro

volumes:
  redis_data:
